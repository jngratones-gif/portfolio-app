<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <p>Add, edit and organize your work by category.</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add a project</h2>
      <form id="project-form">
        <input type="hidden" id="project-id" />

        <label>Title
          <input type="text" id="title" required />
        </label>

        <label>Category
          <select id="category" required>
            <option value="">Choose a category...</option>
          </select>
        </label>

        <label>Description
          <textarea id="description" rows="3"></textarea>
        </label>

        <label>Tags (comma separated)
          <input type="text" id="tags" placeholder="javascript, api" />
        </label>

        <label>Link
          <input type="url" id="link" placeholder="https://..." />
        </label>

        <!-- Thumbnail upload -->
        <label>Thumbnail image
          <input type="file" id="image" accept="image/*" />
        </label>
        <img id="image-preview" class="thumb" alt="Thumbnail preview" hidden />

        <label class="check">
          <input type="checkbox" id="featured" /> Featured project
        </label>

        <div class="actions">
          <button type="submit" id="save-btn">Save project</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search title or tags..." />
      </div>
      <div id="tabs" class="tabs"></div>
      <p id="count">Loading...</p>
      <div id="project-list"></div>
    </section>
  </main>

  <!-- Firebase is loaded inside app.js, so Dexie is no longer needed -->
  <script type="module" src="app.js"></script>
</body>
</html>
